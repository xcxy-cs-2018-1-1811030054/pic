name: Build Windows exe

# 触发方式：
#   1. 手动触发：仓库页面 -> Actions -> Build Windows exe -> Run workflow
#   2. push 到 main/master 分支时自动构建（产物在 Artifacts 下载）
#   3. 推送 v 开头的 tag（如 v1.0.0）时自动构建并创建 Release
#
# 同时产出两个版本：
#   ImageHunter-win7.exe   —— Python 3.8.10 + PySide6 6.1.3，兼容 Win7/10/11
#   ImageHunter-win10.exe  —— Python 3.11 + PySide6 最新，仅 Win10/11（体积小、启动快）
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release 所需

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252，强制 UTF-8 避免中文/Unicode 输出报错
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONLEGACYWINDOWSSTDIO: "0"

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- 兼容 Windows 7 的构建 ----------
          - name: win7
            python: "3.8.10"
            req: requirements-win7.txt
            out: ImageHunter-win7
            label: "兼容 Win7/10/11"
            # PySide6 6.1.3 — 最后一个支持 Win7 的 Qt6 版本（仅 64 位）
            qtver: "6.1.3"
            # PyInstaller 5.13.2 — 最后一个支持 Win7 且行为稳定的 5.x 版本
            # 注意：--win-private-assemblies 已在 6.0 移除，Win7 上改用 5.x 即可
            pyi: "pyinstaller==5.13.2"
            extra_args: "--noupx"
          # ---------- 现代系统构建 ----------
          - name: win10
            python: "3.11"
            req: requirements.txt
            out: ImageHunter-win10
            label: "Win10/11 (体积更小)"
            qtver: "6.8.1"
            pyi: "pyinstaller"
            extra_args: ""

    name: Build ${{ matrix.name }} (${{ matrix.label }})
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查依赖清单是否存在且为纯 ASCII
        run: |
          if (!(Test-Path "${{ matrix.req }}")) {
            Write-Host "::error::Missing ${{ matrix.req }} - please commit it to the repository root"
            throw "Missing required file: ${{ matrix.req }}"
          }
          Write-Host "Found ${{ matrix.req }}"
          # pip 在 Windows runner 上用系统默认编码(cp1252)读取依赖文件，
          # 非 ASCII 注释会被误解析为包名，导致 "Invalid requirement" 报错
          $raw = [System.IO.File]::ReadAllBytes("${{ matrix.req }}")
          $nonAscii = @($raw | Where-Object { $_ -gt 127 })
          if ($nonAscii.Count -gt 0) {
            Write-Host "::error::${{ matrix.req }} contains $($nonAscii.Count) non-ASCII bytes - pip will fail to parse it"
            throw "Non-ASCII content found in ${{ matrix.req }}"
          }
          Write-Host "${{ matrix.req }} is pure ASCII - OK"
          Get-Content "${{ matrix.req }}"

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"

      - name: 降级 pip/setuptools（Py3.8 需要）
        if: matrix.name == 'win7'
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<60" wheel

      - name: 显示环境信息
        run: |
          python -c "import sys, platform; print('Python:', sys.version); print('Bitness:', platform.architecture()[0]); print('Machine:', platform.machine())"
          python -m pip --version

      - name: 安装依赖
        run: |
          python -m pip install -r ${{ matrix.req }}
          if ($LASTEXITCODE -ne 0) { throw "pip install failed for ${{ matrix.req }}" }

      - name: 强制确保 PySide6 已安装（防清单解析遗漏）
        run: |
          python -c "import PySide6" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PySide6 missing - installing ${{ matrix.qtver }} separately"
            python -m pip install "PySide6==${{ matrix.qtver }}"
            if ($LASTEXITCODE -ne 0) { throw "PySide6 install failed" }
          } else {
            Write-Host "PySide6 already available"
          }

      - name: 安装 PyInstaller
        run: |
          python -m pip install "${{ matrix.pyi }}"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }

      - name: 列出已安装包（诊断）
        if: always()
        run: |
          python -m pip list
          Write-Host "=== Key package check ==="
          python -m pip show PySide6 shiboken6 numpy opencv-python-headless

      - name: 校验关键版本（win7 构建）
        if: matrix.name == 'win7'
        run: |
          python -c "import sys; v=sys.version_info; assert v[:2]==(3,8), 'Python 3.8 required'; print('Python', sys.version)"
          python -c "import PySide6; v=PySide6.__version__; assert v.startswith('6.1'), 'PySide6 6.1.x required'; print('PySide6', v)"
          python -c "import PyInstaller; v=PyInstaller.__version__; assert v.startswith('5.'), 'PyInstaller 5.x required'; print('PyInstaller', v)"

      - name: 校验核心依赖可导入
        run: |
          python -c "import PySide6, cv2, bs4, requests, numpy; print('All core dependencies imported OK')"

      - name: 打包 exe
        # 用 PowerShell 数组逐个传参，避免续行符(反引号)与空值拼接的解析问题
        shell: pwsh
        run: |
          $argList = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', '${{ matrix.out }}',
            '--hidden-import=PySide6.QtSvg'
          )
          $extra = '${{ matrix.extra_args }}'.Trim()
          if ($extra.Length -gt 0) {
            $argList += $extra.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          }
          Write-Host "Running: python -m PyInstaller $($argList -join ' ') main.py"
          python -m PyInstaller @argList main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: 打印构建目录（诊断）
        if: always()
        run: |
          Write-Host "=== Working directory files ==="
          Get-ChildItem | Select-Object Name, Length | Format-Table -AutoSize
          if (Test-Path build) {
            Write-Host "=== build directory ==="
            Get-ChildItem build -Recurse -Depth 1 | Select-Object FullName | Format-Table -AutoSize
          }
          if (Test-Path "build/*/warn-*.txt") {
            Write-Host "=== PyInstaller warn file ==="
            Get-Content "build/*/warn-*.txt" -TotalCount 50
          }

      - name: 校验产物
        run: |
          $exe = "dist/${{ matrix.out }}.exe"
          if (!(Test-Path $exe)) { throw "exe was not generated: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("{0} size: {1:N1} MB" -f $exe, $size)

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}.exe
          retention-days: 30

      - name: 发布 Release（仅推送 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out }}.exe
          generate_release_notes: true
