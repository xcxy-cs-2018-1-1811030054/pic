name: Build Windows exe

# 触发方式：
#   1. 手动触发：仓库页面 -> Actions -> Build Windows exe -> Run workflow
#   2. push 到 main/master 分支时自动构建（产物在 Artifacts 下载）
#   3. 推送 v 开头的 tag（如 v1.0.0）时自动构建并创建 Release
#
# 同时产出两个版本：
#   ImageHunter-win7.exe   —— Python 3.8.10 + PySide6 6.1.3，兼容 Win7/10/11
#   ImageHunter-win10.exe  —— Python 3.11 + PySide6 最新，仅 Win10/11（体积小、启动快）
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release 所需

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- 兼容 Windows 7 的构建 ----------
          - name: win7
            python: "3.8.10"
            req: requirements-win7.txt
            out: ImageHunter-win7
            label: "兼容 Win7/10/11"
            extra_args: "--noupx --win-private-assemblies"
          # ---------- 现代系统构建 ----------
          - name: win10
            python: "3.11"
            req: requirements.txt
            out: ImageHunter-win10
            label: "Win10/11 (体积更小)"

    name: Build ${{ matrix.name }} (${{ matrix.label }})
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查依赖清单是否存在
        run: |
          if (!(Test-Path "${{ matrix.req }}")) {
            Write-Host "::error::找不到 ${{ matrix.req }}，请确认该文件已提交到仓库根目录"
            throw "缺少 ${{ matrix.req }}"
          }
          Write-Host "找到 ${{ matrix.req }}"
          Get-Content "${{ matrix.req }}"

      - name: 安装 Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"

      - name: 降级 pip/setuptools（Py3.8 需要）
        if: matrix.name == 'win7'
        run: |
          python -m pip install --upgrade "pip<24.1" setuptools==58.1.0 wheel

      - name: 安装依赖
        run: |
          python -m pip install -r ${{ matrix.req }}
          python -m pip install pyinstaller

      - name: 校验关键版本（win7 构建）
        if: matrix.name == 'win7'
        run: |
          python -c "import sys; v=sys.version_info; assert v[:2]==(3,8), '需 Python 3.8'; print('Python', sys.version)"
          python -c "import PySide6; v=PySide6.__version__; assert v.startswith('6.1'), 'PySide6 必须是 6.1.x'; print('PySide6', v)"

      - name: 校验核心依赖可导入
        run: |
          python -c "import PySide6, cv2, bs4, requests, numpy; print('全部依赖导入成功')"

      - name: 打包 exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name ${{ matrix.out }} `
            ${{ matrix.extra_args }} `
            --hidden-import=PySide6.QtSvg `
            main.py

      - name: 校验产物
        run: |
          $exe = "dist/${{ matrix.out }}.exe"
          if (!(Test-Path $exe)) { throw "exe 未生成: $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("{0} 大小: {1:N1} MB" -f $exe, $size)

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}.exe
          retention-days: 30

      - name: 发布 Release（仅推送 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out }}.exe
          generate_release_notes: true
